name: Zoom apply (navegador)

# Reemplaza a la Edge Function `zoom-apply` (Fase 2, API REST — pausada por
# falta de permisos de cuenta): drena supabase/zoom_outbox manejando un
# navegador real (Playwright) contra la UI web de Zoom, reusando una sesión
# ya logueada a mano (ver zoom-automation/capture-session.ts y
# ZOOM_AUTOMATION.md). No se activa sola hasta que existan los secrets
# ZOOM_SESSION_STATE_B64_1/_2 — sin ellos, este workflow falla rápido y no
# hace nada destructivo.
#
# La sesión en base64 no entra en un solo secret de GitHub (un secret de
# ~50 KB dio "too large" — el límite real resultó más chico de lo
# documentado) — se parte en pedazos de ~20 KB y se reconstruye acá. La
# cantidad de pedazos varía según cuánto pese la sesión capturada (creció
# de 5 a 13 al recapturarla el 2026-09-13, sin motivo identificado — Zoom
# u otro tercero debe estar seteando más localStorage/cookies que antes
# bajo *.zoom.us) — si vuelve a crecer, hay que agregar más
# `ZOOM_SESSION_STATE_B64_N` acá Y como secrets nuevos, no alcanza con
# recapturar sin también tocar este workflow.
#
# Sin cron automático a propósito (2026-09-12): activarlo ahora sería
# correr un runner completo con Playwright+Chromium cada 10 minutos contra
# una `zoom_outbox` que siempre está vacía — no hay `meeting_schedules`
# reales cargados todavía (Fase 4, sin UI) ni un cron de `reconcile` que
# la alimente (Fase 5). Puro gasto de minutos de GitHub Actions sin ningún
# trabajo real que hacer. Se reactiva el `schedule:` recién en Fase 5,
# junto con el cron de `reconcile` que sí llena la cola. Hasta entonces,
# probar a demanda con `workflow_dispatch` (`gh workflow run
# zoom-apply-browser.yml`).

on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # @supabase/supabase-js necesita WebSocket nativo para inicializar
          # el RealtimeClient (aunque este script no use realtime) — falla
          # con Node 20 ("Node.js 20 detected without native WebSocket
          # support"). Node ≥22 lo tiene. No confundir con el Node 20 de
          # deploy.yml (ese es un workflow distinto, sin esta restricción).
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restaurar sesión de Zoom
        run: |
          mkdir -p zoom-automation/.session
          printf '%s%s%s%s%s%s%s%s%s%s%s%s%s' \
            "${{ secrets.ZOOM_SESSION_STATE_B64_1 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_2 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_3 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_4 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_5 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_6 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_7 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_8 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_9 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_10 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_11 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_12 }}" \
            "${{ secrets.ZOOM_SESSION_STATE_B64_13 }}" \
            | base64 -d > zoom-automation/.session/zoom-storage-state.json

      - name: Aplicar jobs pendientes contra Zoom
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run zoom:apply

      - name: Subir capturas de pantalla de fallas (si hubo)
        # `if: failure()` nunca disparaba: apply.ts atrapa el error de cada
        # job del outbox y sigue con el siguiente, así que el step de arriba
        # nunca sale con código de error aunque jobs individuales hayan
        # fallado y dejado capturas — gotcha encontrado 2026-09-13.
        # `if-no-files-found: ignore` de abajo ya cubre el caso sin fallas.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zoom-apply-failures
          path: zoom-automation/.session/failures/
          retention-days: 7
          if-no-files-found: ignore
